# =============================================================================
# Heat Orchestrator – companion app notifications
# =============================================================================
# Pushes a human readable message to every Home Assistant companion app
# (all mobile_app devices) whenever the orchestrator changes state
# (OFF, OFF_LOCKOUT, DHW_QUOTA, HEAT_GF, HEAT_FF) or changes which rooms it
# is heating while it stays on the same floor.
#
# Sources (all written by the AppDaemon app, nothing new is added):
#   input_text.heat_state         FSM state
#   input_boolean.heating_<room>  per-room "valve open" flag
#   input_number.user_sp_<room>   room target
#   input_number.dhw_min_run_hours / pump_on_minutes_today  DHW quota
#   input_datetime.off_window_end end of the night lockout
#
# Include as a package next to the helpers:
#   homeassistant:
#     packages:
#       heat_orchestrator: !include packages/heat_orchestrator_helpers.yaml
#       heat_orchestrator_notifications: !include packages/heat_orchestrator_notifications.yaml
#
# Or paste the single list item below (from `- id:`) into automations.yaml,
# or the UI YAML editor (without the leading `- `).
#
# Recipients are discovered at run time: every mobile_app device tracker maps
# to notify.mobile_app_<slugified device name>. A phone added later is picked
# up automatically. Missing services are skipped (continue_on_error).
# =============================================================================
automation:
  - id: heat_orchestrator_notify_state
    alias: "Heat Orchestrator – notify state changes"
    description: >-
      Companion app notification on heat_state changes and on room set
      changes while heating.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_text.heat_state
        id: state
        not_from: [unknown, unavailable]
        not_to: [unknown, unavailable]
      - trigger: state
        entity_id:
          - input_boolean.heating_gabinet_ani
          - input_boolean.heating_lazienka_parter
          - input_boolean.heating_salon
          - input_boolean.heating_garaz
          - input_boolean.heating_sypialnia
          - input_boolean.heating_lazienka_pietro
          - input_boolean.heating_pokoj_narozny
          - input_boolean.heating_pokoj_z_garazem
        id: room
        from: ["on", "off"]
        to: ["on", "off"]
    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'state' %}
            {{ trigger.from_state.state != trigger.to_state.state }}
          {% else %}
            {# Room flips that belong to a floor/state transition are covered
               by the heat_state message; only report rotations within an
               ongoing HEAT_GF/HEAT_FF run. #}
            {{ states('input_text.heat_state') in ['HEAT_GF', 'HEAT_FF']
               and (now() - states.input_text.heat_state.last_changed).total_seconds() > 30 }}
          {% endif %}
    actions:
      # The app flips the room booleans and heat_state within the same tick.
      # Wait for the burst to settle; mode: restart collapses it into one
      # message (a heat_state change supersedes a pending room message).
      - delay: "00:00:10"
      - variables:
          rooms:
            gabinet_ani: "Gabinet Ani"
            lazienka_parter: "Łazienka Parter"
            salon: "Salon"
            garaz: "Garaż"
            sypialnia: "Sypialnia"
            lazienka_pietro: "Łazienka Piętro"
            pokoj_narozny: "Pokój narożny"
            pokoj_z_garazem: "Pokój z garażem"
          state_labels:
            # Quoted: unquoted OFF is a YAML 1.1 boolean.
            "OFF": "off"
            "OFF_LOCKOUT": "night pause"
            "DHW_QUOTA": "hot water"
            "HEAT_GF": "ground floor"
            "HEAT_FF": "first floor"
          heat_state: "{{ states('input_text.heat_state') }}"
          prev_state: >
            {{ trigger.from_state.state if trigger.id == 'state' else heat_state }}
          heated_rooms: >
            {% set ns = namespace(out=[]) %}
            {% for key, name in rooms.items() if is_state('input_boolean.heating_' ~ key, 'on') %}
              {% set t = state_attr('climate.' ~ key, 'current_temperature') %}
              {% set sp = states('input_number.user_sp_' ~ key) %}
              {% if t is number and sp | is_number %}
                {% set ns.out = ns.out + [name ~ ' (' ~ t ~ ' → ' ~ (sp | float | round(1)) ~ ' °C)'] %}
              {% else %}
                {% set ns.out = ns.out + [name] %}
              {% endif %}
            {% endfor %}
            {{ ns.out | join(', ') }}
          waiting_rooms: >
            {% set hyst = states('input_number.heating_hyst_on') | float(0.3) %}
            {% set ns = namespace(out=[]) %}
            {% for key, name in rooms.items() %}
              {% set t = state_attr('climate.' ~ key, 'current_temperature') %}
              {% set sp = states('input_number.user_sp_' ~ key) %}
              {% if t is number and sp | is_number and t < (sp | float) - hyst %}
                {% set ns.out = ns.out + [name ~ ' (' ~ t ~ ' → ' ~ (sp | float | round(1)) ~ ' °C)'] %}
              {% endif %}
            {% endfor %}
            {{ ns.out | join(', ') }}
          quota_left: >
            {{ [ (states('input_number.dhw_min_run_hours') | float(0) * 60)
                 - states('input_number.pump_on_minutes_today') | float(0), 0 ] | max | round(0) | int }}
          outdoor: >
            {% set t = state_attr('weather.forecast_home', 'temperature') %}
            {{ 'Outside: ' ~ t ~ ' °C.' if t is number else '' }}
          prev_note: >
            {{ 'Previously: ' ~ state_labels.get(prev_state, prev_state) ~ '.'
               if trigger.id == 'state' else '' }}
          title: >-
            {%- if heat_state == 'HEAT_GF' -%} 🔥 Heating ground floor
            {%- elif heat_state == 'HEAT_FF' -%} 🔥 Heating first floor
            {%- elif heat_state == 'DHW_QUOTA' -%} 💧 Hot water mode
            {%- elif heat_state == 'OFF_LOCKOUT' -%} 🌙 Heating night pause
            {%- elif heat_state == 'OFF' -%} ⏸️ Heating off
            {%- else -%} Heating: {{ heat_state }}
            {%- endif -%}
          message: >-
            {%- if heat_state in ['HEAT_GF', 'HEAT_FF'] -%}
              {{ 'Rooms changed. ' if trigger.id == 'room' else '' }}
              {%- if heated_rooms -%}
                Now heating: {{ heated_rooms }}.
              {%- else -%}
                Pump is running but every room on this floor is in its cooldown, valves closed.
              {%- endif -%}
            {%- elif heat_state == 'DHW_QUOTA' -%}
              Room valves closed, pump runs for the daily hot water minimum ({{ quota_left }} min left today).
            {%- elif heat_state == 'OFF_LOCKOUT' -%}
              Night off window active, heating resumes at {{ states('input_datetime.off_window_end')[:5] }}.
            {%- elif heat_state == 'OFF' -%}
              {%- if waiting_rooms -%}
                Pump stopped (cooldown or pause). Waiting for heat: {{ waiting_rooms }}.
              {%- elif quota_left | int > 0 -%}
                All rooms at target. Hot water minimum left today: {{ quota_left }} min.
              {%- else -%}
                All rooms at target and today's hot water minimum is done.
              {%- endif -%}
            {%- else -%}
              State changed to {{ heat_state }}.
            {%- endif -%}
            {{ (' ' ~ outdoor) if outdoor }}{{ (' ' ~ prev_note) if prev_note }}
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for e in integration_entities('mobile_app') | select('match', 'device_tracker[.]') %}
              {% set d = device_id(e) %}
              {% if d %}
                {% set ns.out = ns.out + ['mobile_app_' ~ (device_attr(d, 'name') | slugify)] %}
              {% endif %}
            {% endfor %}
            {{ ns.out | unique | list }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: "notify.{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  group: heat_orchestrator
                  channel: Heating
